name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Get tag version
        id: get_version
        run: echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Validate version matches pyproject.toml
        run: |
          CODE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$CODE_VERSION" != "${{ steps.get_version.outputs.TAG_VERSION }}" ]; then
            echo "Tag version (${{ steps.get_version.outputs.TAG_VERSION }}) does not match pyproject.toml version ($CODE_VERSION)"
            exit 1
          fi
      - name: Install dependencies
        run: make install-dependencies
      - name: Build
        run: make build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
    outputs:
      version: ${{ steps.get_version.outputs.TAG_VERSION }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    steps:
      - uses: actions/checkout@v4
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            quay.io/systemcraftsman/strimzi-kafka-cli:latest
            quay.io/systemcraftsman/strimzi-kafka-cli:${{ needs.build.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    steps:
      - name: Checkout Homebrew repo
        uses: actions/checkout@v4
        with:
          repository: SystemCraftsman/homebrew-strimzi-kafka-cli
          ref: refs/heads/master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update version in formula
        run: |
          version="$(sed -n 's/.*version "\(.*\)"/\1/p' strimzi-kafka-cli.rb | sed -e 's/^[[:space:]]*//')"
          sed -i -e "s/$version/${{ needs.build.outputs.version }}/g" strimzi-kafka-cli.rb
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit-message: Update to version ${{ needs.build.outputs.version }}
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: version-update-${{ needs.build.outputs.version }}
          assignees: mabulgu
          title: Update to version ${{ needs.build.outputs.version }}
