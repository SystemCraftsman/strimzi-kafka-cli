name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0b8)'
        required: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit SHA for tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/${TAG} --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            echo "::error::Tag ${TAG} not found"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying tag ${TAG} at commit ${SHA}"
      - name: Check Build and Integration Test status for commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"

          check_workflow() {
            local workflow="$1"
            local conclusion=$(gh run list --repo ${{ github.repository }} --workflow "$workflow" --commit "$SHA" --json conclusion --jq '.[0].conclusion')
            if [ -z "$conclusion" ]; then
              echo "::error::$workflow has not run for commit $SHA"
              return 1
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow failed for commit $SHA (status: $conclusion)"
              return 1
            fi
            echo "$workflow passed for commit $SHA"
          }

          failed=0
          check_workflow "Build" || failed=1
          check_workflow "Integration Test" || failed=1

          if [ "$failed" -eq 1 ]; then
            echo "::error::Deploy blocked: required workflows have not passed for this commit"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Get tag version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "TAG_VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate version matches pyproject.toml
        run: |
          CODE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$CODE_VERSION" != "${{ steps.get_version.outputs.TAG_VERSION }}" ]; then
            echo "Tag version (${{ steps.get_version.outputs.TAG_VERSION }}) does not match pyproject.toml version ($CODE_VERSION)"
            exit 1
          fi
      - name: Install dependencies
        run: make install-dependencies
      - name: Build
        run: make build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
    outputs:
      version: ${{ steps.get_version.outputs.TAG_VERSION }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            quay.io/systemcraftsman/strimzi-kafka-cli:latest
            quay.io/systemcraftsman/strimzi-kafka-cli:${{ needs.build.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          generate_release_notes: true

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    steps:
      - name: Checkout Homebrew repo
        uses: actions/checkout@v4
        with:
          repository: SystemCraftsman/homebrew-strimzi-kafka-cli
          ref: refs/heads/master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update formula
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          PYPI_JSON=$(curl -s "https://pypi.org/pypi/strimzi-kafka-cli/${VERSION}/json")
          TARBALL_URL=$(echo "$PYPI_JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          SHA256=$(echo "$PYPI_JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          cat > strimzi-kafka-cli.rb << FORMULA
          class StrimziKafkaCli < Formula
            include Language::Python::Virtualenv

            desc "Command Line Interface for Strimzi Kafka Operator"
            homepage "https://strimzi-cli.dev"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on "python@3.12"

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match "Strimzi Kafka CLI", shell_output("#{bin}/kfk")
              assert_match "CLI Version:", shell_output("#{bin}/kfk --version")
            end
          end
          FORMULA
          sed -i 's/^          //' strimzi-kafka-cli.rb
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add strimzi-kafka-cli.rb
          git diff --cached --quiet && echo "Formula already up to date" || {
            git commit -m "Update to version ${{ needs.build.outputs.version }}"
            git push origin master
          }

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher
      - name: Update server.json version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          python3 -c "
          import json
          with open('server.json') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          for pkg in data.get('packages', []):
              pkg['version'] = '$VERSION'
          with open('server.json', 'w') as f:
              json.dump(data, f, indent=4)
          "
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
