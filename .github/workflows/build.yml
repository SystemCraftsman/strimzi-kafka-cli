# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install setuptools for Python ${{ matrix.python-version }}
        run: python -m pip install --upgrade setuptools

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: make install-dependencies

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Retrieve the kubeconfig and decode it to a file
        run: |
          mkdir ~/.kube
          cp tests/files/yaml/kubeconfig ~/.kube/config

      - name: Test
        run: |
          kfk
          make test

      - name: Build
        run: make build

  integration-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: make install-dependencies

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: strimzi-cli-test
          config: tests/integration/kind-config.yaml

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          kind get kubeconfig --name strimzi-cli-test > ~/.kube/config

      - name: Run integration tests
        run: make test-integration
